<style>
  :root{ --green:#dce9ea; --ink:#173a32; --font:"DM Sans",system-ui,sans-serif; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--green);
    color:var(--ink);
    font-family:var(--font);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  main{
    width:100%;
    max-width:520px;              /* phone-format graphic — cap on desktop, full-bleed on phone */
    padding:0;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  img.notice{
    display:block;
    width:100%;
    height:auto;
    max-width:100%;
  }
  footer{
    width:100%;
    max-width:520px;
    text-align:center;
    padding:18px 16px 28px;
    font-size:15px;
  }
  footer a{ color:#1f805b; font-weight:700; text-decoration:none; }
  footer a:focus-visible{ outline:2px solid #1f805b; outline-offset:3px; border-radius:4px; }
  .tix{
    display:block;
    width:calc(100% - 32px);
    max-width:460px;
    margin:20px auto 4px;
    padding:26px 24px;
    background:#0045AB;
    color:#fff;
    font-weight:800;
    font-size:clamp(24px,7vw,34px);
    line-height:1.1;
    border-radius:999px;
    text-decoration:none;
    box-shadow:0 12px 28px rgba(0,69,171,.32);
  }
  .tix:active{ transform:translateY(1px); }
  header.topcta{ width:100%; max-width:520px; text-align:center; padding:0 16px; }
  .tix-top{
    margin:12px auto 10px;
    padding:11px 20px;
    font-size:clamp(15px,3.8vw,20px);
    max-width:320px;
    box-shadow:0 6px 16px rgba(0,69,171,.26);
  }
  @media (min-width:521px){
    body{ padding-top:24px; }
    img.notice{ border-radius:14px; box-shadow:0 18px 50px rgba(23,58,50,.18); }
  }
</style>
</head>
<body>
  <header class="topcta">
    <a class="tix tix-top" href="https://app.galabid.com/manlytrivia/">Buy, Bid &amp; Book &rarr;</a>
  </header>
  <main>
    <img class="notice" src="open.webp?v=4"
         alt="Manly Campus Fundraising 2026 — NOW OPEN. Buy raffle tickets (1 for $5, 5 for $20, 20 for $50). Silent Auction and Major Prize OPEN — bid now on packages from Carol Gibbons Photography, Archie Rose, Sydney Pelvic Clinic, Tommy Gun's, Scotch Malt Whisky Society, Harbord Diggers, Whale Tales, Mathnasium, Sydney FC and more. Trivia Night — Saturday 15 August, 6:30pm; Trivia tickets $50. Bucketty's Bar on the night — you're donating with every drink; suggest an early dinner or bring a cheese platter / simple snacks. Play starts 7:15 — trivia, bid, raffle, lucky door, best winter costumes. Departures 10:45 by Uber or Bucketty's bus. All funds go towards air-conditioning in classrooms. ManlyCampusFundraising.org">
  </main>
  <footer>
    <a class="tix" href="https://app.galabid.com/manlytrivia/">Buy, Bid &amp; Book &rarr;</a>
    <div style="margin-top:16px"><a href="https://manlycampusfundraising.org/">manlycampusfundraising.org</a></div>
  </footer>
</body>
</html>
